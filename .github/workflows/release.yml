name: Build e Release

# Lança uma versão nova do CubeBin.
#
# Como disparar:
#   • enviar qualquer commit para o branch "release"  → a tag vem do <Version> do CubeBin.App.csproj
#   • ou enviar uma tag no formato v1.2.3
#
# Google Drive: as credenciais reais NUNCA ficam no repositório. Para o pacote publicado
# ter o backup na nuvem funcionando, cadastre em Settings › Secrets and variables › Actions:
#   CUBEBIN_GDRIVE_CLIENT_ID      e      CUBEBIN_GDRIVE_CLIENT_SECRET
# Sem eles, o app é compilado normalmente, só com o backup na nuvem desativado.
on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pacote Linux (CubeBin-linux-x64.zip). O lançamento em si acontece no job do Windows,
  # que espera este terminar e anexa os dois pacotes na mesma versão.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # o Kit NokyLabs (lib/NokyLabs.UI)

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Preparar credenciais do Google Drive
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CUBEBIN_GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CUBEBIN_GDRIVE_CLIENT_SECRET }}
        run: |
          destino="src/CubeBin.Core/GoogleDriveCredentials.Secrets.cs"
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ]; then
            printf 'namespace CubeBin.Core;\npublic static partial class GoogleDriveCredentials\n{\n    public const string ClientId = "%s";\n    public const string ClientSecret = "%s";\n}\n' \
              "$CLIENT_ID" "$CLIENT_SECRET" > "$destino"
            echo "Credenciais do Google Drive configuradas."
          else
            cp "$destino.example" "$destino"
            echo "::warning::Sem credenciais do Google Drive: o backup na nuvem ficará desativado neste pacote."
          fi

      - name: Testes
        run: dotnet test tests/CubeBin.Tests -c Release

      - name: Publicar (linux-x64, arquivo único)
        run: >
          dotnet publish src/CubeBin.App/CubeBin.App.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - name: Compactar
        shell: bash
        run: |
          test -f publish/CubeBin || { echo "Faltou o executável CubeBin."; exit 1; }
          test -f publish/icon.png || { echo "Faltou o icon.png (usado no atalho do launcher)."; exit 1; }
          chmod +x publish/CubeBin
          # O zip guarda a permissão de execução; o NokyLabs Launcher também aplica chmod ao instalar.
          (cd publish && zip -9 -r ../CubeBin-linux-x64.zip .)
          sha256sum CubeBin-linux-x64.zip | awk '{print toupper($1)}' > CubeBin-linux-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cubebin-linux
          path: |
            CubeBin-linux-x64.zip
            CubeBin-linux-x64.zip.sha256
          if-no-files-found: error

  build-and-release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # o Kit NokyLabs (lib/NokyLabs.UI)

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Descobrir a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/CubeBin.App/CubeBin.App.csproj
          $v = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" } else { $tag = "v$v" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Conferir se a versão é nova
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error title=Versão já lançada::A versão $tag já existe. Aumente o <Version> no .csproj (ex.: 1.0.0 → 1.0.1) e envie de novo para o branch release."
            exit 1
          }
          Write-Host "A versão $tag é nova. Seguindo com o lançamento."
          exit 0

      - name: Notas da versão (CHANGELOG.md)
        id: notas
        shell: pwsh
        run: python .github/scripts/notas_da_versao.py ler "${{ steps.versao.outputs.tag }}" CHANGELOG.md

      - name: Preparar credenciais do Google Drive
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.CUBEBIN_GDRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CUBEBIN_GDRIVE_CLIENT_SECRET }}
        run: |
          $destino = "src/CubeBin.Core/GoogleDriveCredentials.Secrets.cs"
          if ($env:CLIENT_ID -and $env:CLIENT_SECRET) {
            $conteudo = @"
          namespace CubeBin.Core;
          public static partial class GoogleDriveCredentials
          {
              public const string ClientId = "$($env:CLIENT_ID)";
              public const string ClientSecret = "$($env:CLIENT_SECRET)";
          }
          "@
            Set-Content -Path $destino -Value $conteudo -Encoding utf8
            Write-Host "Credenciais do Google Drive configuradas."
          } else {
            Copy-Item "src/CubeBin.Core/GoogleDriveCredentials.Secrets.cs.example" $destino
            Write-Host "::warning::Sem credenciais do Google Drive: o backup na nuvem ficará desativado neste pacote."
          }

      - name: Testes
        run: dotnet test tests/CubeBin.Tests -c Release

      - name: Publicar (win-x64, arquivo único)
        run: >
          dotnet publish src/CubeBin.App/CubeBin.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - name: Compactar
        shell: pwsh
        run: |
          if (-not (Test-Path publish\CubeBin.exe)) { throw "Faltou o CubeBin.exe." }
          Compress-Archive -Path publish\* -DestinationPath CubeBin-win-x64.zip
          (Get-FileHash CubeBin-win-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii CubeBin-win-x64.zip.sha256

      - name: Pegar o pacote Linux
        uses: actions/download-artifact@v4
        with:
          name: cubebin-linux

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: CubeBin ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            CubeBin-win-x64.zip
            CubeBin-win-x64.zip.sha256
            CubeBin-linux-x64.zip
            CubeBin-linux-x64.zip.sha256
          body: |
            ## CubeBin ${{ steps.versao.outputs.tag }}

            ### O que há de novo
            <!-- novidades -->
            ${{ steps.notas.outputs.texto }}
            <!-- /novidades -->

            Organiza suas pastas por tipo de arquivo, guarda um backup de tudo e libera espaço com segurança.

            **Como instalar no Windows**
            1. Baixe o `CubeBin-win-x64.zip` abaixo (ou instale pelo NokyLabs Launcher)
            2. Extraia e abra o `CubeBin.exe`
            3. Se aparecer o aviso azul do Windows, clique em "Mais informações" › "Executar assim mesmo"

            **Como instalar no Linux**
            1. Baixe o `CubeBin-linux-x64.zip` abaixo (ou instale pelo NokyLabs Launcher)
            2. Extraia e abra o `CubeBin` (se precisar: `chmod +x CubeBin`)
            3. No GNOME, o ícone perto do relógio precisa da extensão "AppIndicator"

            **Requisitos:** Windows 10 ou 11 (64 bits), ou Linux x64 (Ubuntu 22.04+, Fedora, etc.). Não precisa instalar o .NET.

            Mais detalhes: https://thayttg.github.io/nokylabs/#cubebin

      # Se as notas vieram da seção "Não lançado", ela vira a seção desta versão no CHANGELOG do master.
      - name: Registrar a versão no CHANGELOG
        if: steps.notas.outputs.promover == 'sim'
        shell: bash
        env:
          PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth 1 origin "$PRINCIPAL"
          git checkout -f -B registrar-changelog "origin/$PRINCIPAL"
          python .github/scripts/notas_da_versao.py promover "${{ steps.versao.outputs.tag }}" CHANGELOG.md
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "CHANGELOG: versão ${{ steps.versao.outputs.tag }}"
          git push origin "HEAD:$PRINCIPAL" || echo "::warning::Não consegui registrar a versão no CHANGELOG; ajuste à mão."
