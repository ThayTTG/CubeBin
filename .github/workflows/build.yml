name: Verificar compilação

# Compila o projeto a cada envio para o master (e em pull requests), sem lançar nada.
# Se aparecer um X vermelho aqui, tem erro no código: melhor descobrir agora
# do que na hora de lançar uma versão.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Credenciais de exemplo (o backup na nuvem não é testado aqui)
        shell: pwsh
        run: |
          $destino = "src/CubeBin.Core/GoogleDriveCredentials.Secrets.cs"
          if (-not (Test-Path $destino)) { Copy-Item "$destino.example" $destino }

      - name: Compilar
        run: dotnet build CubeBin.sln -c Release
